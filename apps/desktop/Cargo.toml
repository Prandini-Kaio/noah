[package]
name = "noah-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
noah-workspace = { path = "../../crates/workspace" }
noah-geometry = { path = "../../crates/geometry" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11"] }
noah-photogrammetry = { path = "../../crates/photogrammetry" }
noah-pipeline = { path = "../../crates/pipeline" }
noah-storage = { path = "../../crates/storage" }
serde_json = "1"
